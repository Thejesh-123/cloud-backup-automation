name: Automated Cloud Backup

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create backup
        run: python backup.py

      - name: Upload backup to cloud
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-Backup
          path: backup_*.zip
          retention-days: 7
